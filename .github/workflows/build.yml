name: Build PERCY AI APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q -o PercyAI-project.zip
      - name: Patch engine for new llama.cpp
        run: sed -i '/use_mmap/d' app/src/main/cpp/percy_jni.cpp
      - name: Remove duplicate imports
        run: "awk '!(/^import / && seen[$0]++)' app/src/main/java/com/percy/ai/Actions.kt > /tmp/a.kt && mv /tmp/a.kt app/src/main/java/com/percy/ai/Actions.kt"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install NDK and CMake
        run: 'yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34"'
      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch v1.0.0 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
      - name: Fetch speech model
        run: mkdir -p app/src/main/assets && wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip && unzip -q vosk-model-small-en-us-0.15.zip && mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en && echo percy-vosk-1 > app/src/main/assets/model-en/uuid
      - name: Install Gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip && unzip -q gradle-8.7-bin.zip -d $HOME && echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build APK
        run: 'gradle assembleRelease --no-daemon --console=plain > build.log 2>&1 || { echo "=== ERRORS ==="; grep -n -E "error:|FAILED:|fatal error|undefined reference|CMake Error|e: file" build.log | head -40; exit 1; }'
      - uses: actions/upload-artifact@v4
        with: { name: PERCY-AI-APK, path: 'app/build/outputs/apk/release/*.apk' }
