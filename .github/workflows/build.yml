name: Build PERCY AI APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q -o PercyAI-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34"
      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch b5000 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
      - name: Fetch speech model
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-en-us-0.15.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en
          echo "percy-vosk-1" > app/src/main/assets/model-en/uuid
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PERCY-AI-APK
          path: app/build/outputs/apk/release/*.apk
